
name: Compilar Zen Garden Audio Mod

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Compilar mod
        shell: bash
        run: |
          PROJECT_DIR=$(dirname "$(find . -name build.gradle -not -path '*/.gradle/*' -print -quit)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "No se encontró build.gradle"
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle build

      - name: Guardar JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZenGardenAudioMod
          path: '**/build/libs/*.jar'
          if-no-files-found: error
